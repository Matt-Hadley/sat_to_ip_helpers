# Example sat-to-ip config: everything lives in this one file.
#
# 1. Set [receiver] host, and delete the [[publishers]] blocks (and guides) for apps you don't use.
# 2. Set the secrets this file names, in your terminal or scheduler (never in this file):
#      export OCTOPUS_PASSWORD='…'     your receiver's admin password
#      export JELLYFIN_API_KEY='…'     only if you keep the Jellyfin block
# 3. Then:
#      sat-to-ip check-config -c sat-to-ip.toml    check the settings
#      sat-to-ip channels -c sat-to-ip.toml        pick your channels (rewrites [[channels]] at the end)
#      sat-to-ip run -c sat-to-ip.toml --dry-run   try it without changing anything

[receiver]
type = "octopus_net"
host = "octopus.local"
password_env = "OCTOPUS_PASSWORD"
positions = ["28.2E"]              # satellite positions to scan
# kingofsat_language = "eng"       # only scan transponders with channels in this language (KingOfSat's filter)
# host = "https://octopus.local"   # https: add verify_tls = true, or ca_file = "…", to check its certificate

[checks]
max_removed = 5                    # refuse to drop more saved channels than this
min_guide_match = 0.5              # refuse a guide that matches fewer than half the channels

# Gracenote guide data, read from Channels DVR (for the Channels DVR publisher)
[guides.gracenote]
type = "gracenote"
url = "http://localhost:8089"
station_list = "GBR-1000193-DEFAULT"   # Gracenote's UK free-to-air satellite lineup; keep it for the UK
mappings = "uk"                        # built-in name → call sign table for channels whose names differ

# A free XMLTV feed (for Jellyfin and Threadfin/Plex): Freeview-EPG, UK free-to-air TV and radio,
# rebuilt every 12 hours, for personal use (https://github.com/dp247/Freeview-EPG)
[guides.freeview]
type = "xmltv"
url = "https://raw.githubusercontent.com/dp247/Freeview-EPG/master/epg.xml"
mappings = "freeview-epg"              # built-in Name,GuideId table for this feed

# Regional channels come in several versions in the guide; pick yours by name → guide ID
[guides.freeview.extra_mappings]
"ITV1 HD" = "ITV1Granada.uk"
"Channel 4 HD" = "Channel4North.uk"

[[publishers]]
type = "channels_dvr"
url = "http://localhost:8089"
guide = "gracenote"
tv_source = "SatTV"                    # the Channels DVR source you created (see docs/setup/channels-dvr.md)
# radio_source = "SatRadio"
# channel_numbers = "list"             # use the [[channels]] numbers instead of Channels' own (from 9000)

[[publishers]]
type = "jellyfin"
url = "http://localhost:8096"
api_key_env = "JELLYFIN_API_KEY"
guide = "freeview"
output_dir = "/srv/jellyfin/livetv"         # mounted into the Jellyfin container

[[publishers]]
type = "threadfin"
guide = "freeview"
output_dir = "/srv/threadfin/livetv"        # mounted into the Threadfin container; Plex uses Threadfin

# Your channels, in order. The list below is what an Octopus NET calls the UK free-to-air channels on
# 28.2°E; run `sat-to-ip channels -c sat-to-ip.toml` to pick from what your receiver has found (it rewrites
# this part, keeping these ticked where they match), or edit by hand:
#   start = the first channel's number; the rest count up. A missing channel keeps its number free.
#   "Name"                                 a channel by name, exactly as your receiver shows it
#   { name = "Name", frequency = 10773 }   that name on that frequency (MHz), if the name appears twice
#   { name = "Name", service = 2105 }      that broadcast service, whatever it's called now
#   { name = "A", additional_names = ["B"], extra_pids = [264, 268] }
#                                          a timeshare: A and B take turns on one stream; list both PMT PIDs
#   { rest = "tv" }                        every TV (or "radio", or "all") channel not listed before

