# Example sat-to-ip config: everything lives in this one file. Copy it, keep only the publishers you
# use, then:
#   sat-to-ip channels -c sat-to-ip.toml        pick your channels (fills in [[channels]] at the end)
#   sat-to-ip check-config -c sat-to-ip.toml    check the settings
#   sat-to-ip run -c sat-to-ip.toml --dry-run   try it without changing anything
# Secrets are never stored here: every *_env key names an environment variable.

[receiver]
type = "octopus_net"
host = "octopus.local"
password_env = "OCTOPUS_PASSWORD"
positions = ["28.2E"]              # satellite positions to scan

[checks]
max_removed = 5                    # refuse to drop more saved channels than this
min_guide_match = 0.5              # refuse a guide that matches fewer than half the channels

# Gracenote guide data, read from Channels DVR (for the Channels DVR publisher)
[guides.gracenote]
type = "gracenote"
url = "http://localhost:8089"
station_list = "GBR-1000193-DEFAULT"
mappings = "uk"

# A free XMLTV feed (for Jellyfin and Threadfin/Plex): Freeview-EPG, UK free-to-air TV and radio,
# rebuilt every 12 hours, for personal use (https://github.com/dp247/Freeview-EPG)
[guides.freeview]
type = "xmltv"
url = "https://raw.githubusercontent.com/dp247/Freeview-EPG/master/epg.xml"
mappings = "freeview-epg"              # built-in Name,GuideId table for this feed

# Regional channels come in several versions in the guide; pick yours by name → guide ID
[guides.freeview.extra_mappings]
"ITV1 HD" = "ITV1Granada.uk"
"Channel 4 HD" = "Channel4North.uk"

[[publishers]]
type = "channels_dvr"
url = "http://localhost:8089"
guide = "gracenote"
tv_source = "OctopusTV"
# radio_source = "OctopusRadio"
# channel_numbers = "list"           # use the numbers from channels.txt instead of Channels' own

[[publishers]]
type = "jellyfin"
url = "http://localhost:8096"
api_key_env = "JELLYFIN_API_KEY"
guide = "freeview"
output_dir = "/srv/media/jellyfin/livetv"   # mounted into the Jellyfin container

[[publishers]]
type = "threadfin"
guide = "freeview"
output_dir = "/srv/media/threadfin/livetv"  # mounted into the Threadfin container; Plex uses Threadfin

# Your channels, in order. Run `sat-to-ip channels -c sat-to-ip.toml` to pick them from what your
# receiver has found (it rewrites this part), or edit by hand:
#   start = the first channel's number; the rest count up. A missing channel keeps its number free.
#   "Name"                                 a channel by name, exactly as your receiver shows it
#   { name = "Name", frequency = 10773 }   that name on that frequency (MHz), if the name appears twice
#   { rest = "tv" }                        every TV (or "radio", or "all") channel not listed before

